# The about page is hidden from the published site.
# Delete "about" from this list to bring it back.
exclude:
  - about

# Jekyll skips files and folders starting with "_" (matched by name, at any depth); the ISO AMT
# calculator (isoamtcalc/, a Next.js static export) needs these.
include:
  - _next
  - _not-found
  - _global-error
  - _buildManifest.js
  - _ssgManifest.js
  - __next.*
